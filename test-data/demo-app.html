<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestCaptive Demo Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .logo p {
            color: #666;
            font-size: 0.9rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .btn:hover {
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .links {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .hidden {
            display: none;
        }
        
        .dashboard {
            text-align: center;
        }
        
        .dashboard h2 {
            color: #333;
            margin-bottom: 1rem;
        }
        
        .nav-menu {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }
        
        .nav-menu a {
            flex: 1;
            padding: 0.5rem 1rem;
            background: #f8f9fa;
            color: #333;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            transition: background-color 0.3s ease;
        }
        
        .nav-menu a:hover {
            background: #e9ecef;
        }
        
        .nav-menu a.active {
            background: #667eea;
            color: white;
        }
        
        .content-area {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 5px;
            min-height: 200px;
        }
        
        .profile-form {
            display: grid;
            gap: 1rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .items-list {
            list-style: none;
        }
        
        .items-list li {
            padding: 0.5rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .items-list li:last-child {
            border-bottom: none;
        }
        
        .btn-small {
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .btn-small:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="loginForm">
            <div class="logo">
                <h1>TestCaptive</h1>
                <p>Demo Application for UI Testing</p>
            </div>
            
            <form id="login" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Email Address</label>
                    <input type="email" id="username" name="username" required 
                           placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn" id="login-button">Sign In</button>
            </form>
            
            <div class="links">
                <a href="#" onclick="showRegister()">Don't have an account? Sign up</a>
            </div>
        </div>
        
        <!-- Registration Form -->
        <div id="registerForm" class="hidden">
            <div class="logo">
                <h1>Sign Up</h1>
                <p>Create your TestCaptive account</p>
            </div>
            
            <form id="register" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password" required>
                </div>
                
                <button type="submit" class="btn">Create Account</button>
            </form>
            
            <div class="links">
                <a href="#" onclick="showLogin()">Already have an account? Sign in</a>
            </div>
        </div>
        
        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="dashboard">
                <h2>Welcome to your Dashboard!</h2>
                <p>Hello, <span id="userDisplayName">User</span></p>
                
                <div class="nav-menu">
                    <a href="#" onclick="showSection('profile')" id="nav-profile">My Profile</a>
                    <a href="#" onclick="showSection('settings')" id="nav-settings">Settings</a>
                    <a href="#" onclick="showSection('data')" id="nav-data">My Data</a>
                    <a href="#" onclick="logout()" id="nav-logout">Logout</a>
                </div>
                
                <div class="content-area" id="contentArea">
                    <p>Select a menu item to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Application state
        let currentUser = null;
        let currentSection = null;
        let userData = [];
        
        // Initialize demo data
        function initDemoData() {
            userData = [
                { id: 1, name: 'Important Document', type: 'PDF' },
                { id: 2, name: 'Project Notes', type: 'Text' },
                { id: 3, name: 'Meeting Recording', type: 'Audio' }
            ];
        }
        
        // Authentication functions
        function handleLogin(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const username = formData.get('username');
            const password = formData.get('password');
            
            // Simulate login
            if (username && password) {
                currentUser = { 
                    email: username, 
                    name: username.split('@')[0] 
                };
                
                showDashboard();
            }
        }
        
        function handleRegister(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            
            currentUser = {
                email: formData.get('email'),
                name: formData.get('firstName') + ' ' + formData.get('lastName')
            };
            
            showDashboard();
        }
        
        function logout() {
            currentUser = null;
            currentSection = null;
            showLogin();
        }
        
        // Navigation functions
        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }
        
        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }
        
        function showDashboard() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            if (currentUser) {
                document.getElementById('userDisplayName').textContent = currentUser.name;
            }
            
            initDemoData();
        }
        
        function showSection(section) {
            currentSection = section;
            
            // Update navigation
            document.querySelectorAll('.nav-menu a').forEach(link => {
                link.classList.remove('active');
            });
            document.getElementById(`nav-${section}`).classList.add('active');
            
            // Update content area
            const contentArea = document.getElementById('contentArea');
            
            switch(section) {
                case 'profile':
                    contentArea.innerHTML = `
                        <h3>User Profile</h3>
                        <div class="profile-form">
                            <div class="form-group">
                                <label for="profileEmail">Email</label>
                                <input type="email" id="profileEmail" value="${currentUser.email}" readonly>
                            </div>
                            <div class="form-group">
                                <label for="profileName">Display Name</label>
                                <input type="text" id="profileName" value="${currentUser.name}">
                            </div>
                            <div class="form-group">
                                <label for="profileBio">Bio</label>
                                <input type="text" id="profileBio" placeholder="Tell us about yourself">
                            </div>
                            <button class="btn" onclick="updateProfile()">Update Profile</button>
                        </div>
                    `;
                    break;
                    
                case 'settings':
                    contentArea.innerHTML = `
                        <h3>Account Settings</h3>
                        <div class="profile-form">
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="notifications" checked> 
                                    Email Notifications
                                </label>
                            </div>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="darkMode"> 
                                    Dark Mode
                                </label>
                            </div>
                            <div class="form-group">
                                <label for="language">Language</label>
                                <select id="language" class="input-field">
                                    <option value="en">English</option>
                                    <option value="es">Spanish</option>
                                    <option value="fr">French</option>
                                </select>
                            </div>
                            <button class="btn" onclick="saveSettings()">Save Settings</button>
                        </div>
                    `;
                    break;
                    
                case 'data':
                    contentArea.innerHTML = `
                        <h3>My Data</h3>
                        <p>Manage your stored data and files.</p>
                        <div style="margin: 1rem 0;">
                            <button class="btn" onclick="addDataItem()">Add New Item</button>
                        </div>
                        <ul class="items-list" id="dataList">
                            ${userData.map(item => `
                                <li>
                                    <span>${item.name} (${item.type})</span>
                                    <button class="btn-small" onclick="deleteDataItem(${item.id})">Delete</button>
                                </li>
                            `).join('')}
                        </ul>
                    `;
                    break;
            }
        }
        
        // Action functions
        function updateProfile() {
            const name = document.getElementById('profileName').value;
            const bio = document.getElementById('profileBio').value;
            
            currentUser.name = name;
            document.getElementById('userDisplayName').textContent = name;
            
            alert('Profile updated successfully!');
        }
        
        function saveSettings() {
            const notifications = document.getElementById('notifications').checked;
            const darkMode = document.getElementById('darkMode').checked;
            const language = document.getElementById('language').value;
            
            alert(`Settings saved: Notifications: ${notifications}, Dark Mode: ${darkMode}, Language: ${language}`);
        }
        
        function addDataItem() {
            const name = prompt('Enter item name:');
            const type = prompt('Enter item type:');
            
            if (name && type) {
                const newItem = {
                    id: Date.now(),
                    name: name,
                    type: type
                };
                userData.push(newItem);
                showSection('data'); // Refresh the data section
            }
        }
        
        function deleteDataItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                userData = userData.filter(item => item.id !== id);
                showSection('data'); // Refresh the data section
            }
        }
        
        // Initialize the application
        showLogin();
    </script>
</body>
</html>
