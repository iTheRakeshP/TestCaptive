[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Allure is the primary reporter (rich step tree, attachments, history).
# pytest-html is kept as a lightweight smoke fallback at reports/report.html.
addopts = -v --tb=short --alluredir=reports/allure-results --clean-alluredir --html=reports/report.html --self-contained-html --css=reports/custom-style.css
